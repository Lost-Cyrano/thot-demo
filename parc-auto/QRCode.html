<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Thot – QR Code</title>
  <style>
    :root {
      --red: #e60000; --red-hover: #b30000; --bg: #f5f5f5; --card-bg: #ffffff;
      --border: #ddd; --text: #333; --text-light: #666; --radius: 12px;
      --shadow: 0 2px 8px rgba(0,0,0,0.08);
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: system-ui, -apple-system, 'Segoe UI', sans-serif;
      background: var(--bg); color: var(--text); min-height: 100vh;
      display: flex; justify-content: center; padding: 16px;
    }
    .container { width: 100%; max-width: 500px; display: flex; flex-direction: column; gap: 16px; }
    .header {
      background: var(--card-bg); border: 1px solid var(--border); border-radius: var(--radius);
      padding: 14px 18px; display: flex; align-items: center; justify-content: space-between;
      flex-wrap: wrap; gap: 10px; box-shadow: var(--shadow);
    }
    .header-left { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; font-weight: 600; }
    .btn-back {
      background: transparent; border: 1.5px solid #ccc; padding: 8px 14px;
      border-radius: 8px; cursor: pointer; font-weight: 600; font-size: 0.9rem;
      transition: all 0.2s; text-decoration: none; color: var(--text);
    }
    .btn-back:hover { background: #eee; }
    .btn-logout {
      background: transparent; color: var(--red); border: 1.5px solid var(--red);
      padding: 8px 16px; border-radius: 8px; cursor: pointer; font-weight: 600;
      font-size: 0.9rem; transition: all 0.2s;
    }
    .btn-logout:hover { background: var(--red); color: #fff; }
    .qr-card {
      background: var(--card-bg); border: 1px solid var(--border); border-radius: var(--radius);
      box-shadow: var(--shadow); padding: 30px 20px;
      display: flex; flex-direction: column; align-items: center; gap: 20px;
    }
    .qr-container {
      background: #fff; border: 3px solid var(--red); border-radius: 16px; padding: 16px;
      display: flex; align-items: center; justify-content: center;
      box-shadow: 0 4px 12px rgba(230, 0, 0, 0.15); position: relative;
    }
    #qr-code { display: flex; align-items: center; justify-content: center; position: relative; }
    #qr-code img, #qr-code canvas { width: 250px; height: 250px; max-width: 100%; }
    .qr-logo-overlay {
      position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
      width: 55px; height: 55px; background: #fff; padding: 4px; border-radius: 4px;
      box-shadow: 0 0 0 3px #fff; z-index: 10; pointer-events: none;
    }
    .qr-logo-overlay img { width: 100%; height: 100%; object-fit: contain; display: block; }
    .qr-title { font-size: 1.3rem; font-weight: 700; color: var(--text); text-align: center; word-break: break-word; }
    .qr-subtitle { font-size: 0.9rem; color: var(--text-light); text-align: center; margin-top: -12px; }
    .qr-url-preview {
      background: #f5f5f5; border: 1px solid #e0e0e0; border-radius: 8px;
      padding: 10px 14px; font-size: 0.75rem; color: var(--text-light);
      word-break: break-all; text-align: center; font-family: monospace; width: 100%;
    }
    .btn-download {
      background: var(--red); color: #fff; border: none; padding: 12px 24px;
      border-radius: 8px; cursor: pointer; font-weight: 600; font-size: 1rem;
      transition: all 0.2s; width: 100%;
    }
    .btn-download:hover { background: var(--red-hover); }
    .btn-download:disabled { background: #ccc; cursor: not-allowed; opacity: 0.6; }
    .error-state { background: #fff0f0; color: var(--red); padding: 20px; border-radius: var(--radius); text-align: center; font-weight: 600; }
    .loader { text-align: center; padding: 40px; color: var(--text-light); font-size: 1.1rem; }
    .loader-spinner {
      width: 40px; height: 40px; border: 4px solid #e0e0e0; border-top-color: var(--red);
      border-radius: 50%; animation: spin 1s linear infinite; margin: 0 auto 16px;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    @media print {
      body { background: #fff; padding: 0; }
      .header, .btn-download, .qr-url-preview, .btn-back, .btn-logout { display: none !important; }
      .qr-card { border: none; box-shadow: none; }
    }
    @media (max-width: 480px) {
      .qr-card { padding: 20px 12px; }
      .qr-container { padding: 12px; }
      #qr-code img, #qr-code canvas { width: 200px; height: 200px; }
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="header">
      <div class="header-left">
        <span>📱 QR Code</span>
      </div>
      <div style="display:flex;gap:8px;flex-wrap:wrap;">
        <button class="btn-back" id="btn-back">← Retour</button>
        <button class="btn-logout" id="btn-logout">Déconnexion</button>
      </div>
    </div>

    <div id="content">
      <div class="loader">
        <div class="loader-spinner"></div>
        Génération du QR Code...
      </div>
    </div>
  </div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>

  <script>
    /* ============================================================
       VERSION DÉMO — pas de Firebase.
       Clés localStorage :
         thot_demo_db    → base JSON { U, A, I, P, ... }
         thot_demo_user  → { nivol, role, loggedAt }
       ============================================================ */
    const DB_KEY = 'thot_demo_db';
    const USER_KEY = 'thot_demo_user';

    function readDb() {
      const raw = localStorage.getItem(DB_KEY);
      if (!raw) return null;
      try { return JSON.parse(raw); } catch { return null; }
    }
    function readUser() {
      const raw = localStorage.getItem(USER_KEY);
      if (!raw) return null;
      try { return JSON.parse(raw); } catch { return null; }
    }

    const contentEl = document.getElementById('content');
    const btnBack = document.getElementById('btn-back');

    const urlParams = new URLSearchParams(window.location.search);
    const type = urlParams.get('type'); // 'vehicule' ou 'inventaire'
    const id = urlParams.get('id');

    // ---- Init ----
    function init() {
      const db = readDb();
      if (!db) {
        window.location.href = '../login.html?redirect=' + encodeURIComponent(window.location.href);
        return;
      }
      const u = readUser();
      const nivol = (u && u.nivol) ? u.nivol : 'DEMO00000000';

      // On n'interdit plus l'accès (démo), on avertit seulement si non-admin.
      const isAdmin = !!(db.A && db.A[nivol]);

      updateBackButton();

      if (!type || !id) {
        contentEl.innerHTML = '<div class="error-state">⚠️ Paramètres manquants : type et id sont requis.</div>';
        return;
      }

      // Avertissement non bloquant
      const warnHtml = !isAdmin
        ? '<div class="error-state" style="background:#fff8f0;color:#a06000;margin-bottom:12px;">ℹ️ Accès normalement réservé aux administrateurs. En démo, la génération reste disponible.</div>'
        : '';

      generateQR(warnHtml);
    }

    function updateBackButton() {
      if (type === 'vehicule') {
        btnBack.onclick = () => { window.location.href = './admin.html'; };
        btnBack.textContent = '← Parc Auto';
      } else if (type === 'inventaire') {
        btnBack.onclick = () => { window.location.href = '../inventaire/admin.html'; };
        btnBack.textContent = '← Inventaires';
      } else {
        btnBack.onclick = () => { window.location.href = '../admin.html'; };
        btnBack.textContent = '← Retour';
      }
    }

    document.getElementById('btn-logout').addEventListener('click', () => {
      localStorage.removeItem(USER_KEY);
      window.location.href = '../login.html';
    });

    // ---- Chargement + génération ----
    function generateQR(warnHtml) {
      const db = readDb();
      let title = '', subtitle = '', targetUrl = '', filename = '';

      if (type === 'vehicule') {
        const v = (db.P && db.P[id]) || null;
        if (!v) {
          contentEl.innerHTML = '<div class="error-state">⚠️ Véhicule introuvable.</div>';
          return;
        }
        title = v.n || v.im || id;
        subtitle = v.im ? `Immatriculation : ${v.im}` : '';
        // Depuis /parc-auto/, la page cible est ../parc-auto/index.html (ou ./index.html si le serveur sert le dossier)
        // On construit une URL absolue à partir de l'URL actuelle.
        const basePath = window.location.pathname.replace(/\/QRCode\.html$/, '/');
        const rootPath = basePath.replace(/\/parc-auto\/$/, '/');
        targetUrl = `${window.location.origin}${rootPath}parc-auto/index.html?vehicule=${encodeURIComponent(id)}`;
        filename = `QRCode_vehicule_${(v.im || id).replace(/[^a-z0-9]/gi, '_').toLowerCase()}`;

      } else if (type === 'inventaire') {
        const inv = (db.I && db.I[id]) || null;
        if (!inv) {
          contentEl.innerHTML = '<div class="error-state">⚠️ Inventaire introuvable.</div>';
          return;
        }
        title = inv.nom || id;
        subtitle = 'Inventaire';
        const basePath = window.location.pathname.replace(/\/QRCode\.html$/, '/');
        const rootPath = basePath.replace(/\/parc-auto\/$/, '/');
        targetUrl = `${window.location.origin}${rootPath}inventaire/?inv=${encodeURIComponent(id)}`;
        filename = `QRCode_inventaire_${id.replace(/[^a-z0-9]/gi, '_').toLowerCase()}`;

      } else {
        contentEl.innerHTML = `<div class="error-state">⚠️ Type inconnu : "${type}".</div>`;
        return;
      }

      renderQRCode(targetUrl, title, subtitle, filename, warnHtml);
    }

    function renderQRCode(qrTargetUrl, title, subtitle, filename, warnHtml = '') {
      contentEl.innerHTML = `
        ${warnHtml}
        <div class="qr-card">
          <div class="qr-container">
            <div id="qr-code"></div>
            <div class="qr-logo-overlay" id="qr-logo-overlay">
              <img src="../images/LogoThot.png" alt="Logo Thot" onerror="this.style.display='none';">
            </div>
          </div>
          <div class="qr-title">${escapeHtml(title)}</div>
          ${subtitle ? `<div class="qr-subtitle">${escapeHtml(subtitle)}</div>` : ''}
          <div class="qr-url-preview">${escapeHtml(qrTargetUrl)}</div>
          <button class="btn-download" id="btn-download" disabled>📥 Télécharger</button>
        </div>`;

      const qrContainer = document.getElementById('qr-code');
      new QRCode(qrContainer, {
        text: qrTargetUrl,
        width: 250,
        height: 250,
        colorDark: '#e60000',
        colorLight: '#ffffff',
        correctLevel: QRCode.CorrectLevel.H
      });

      setTimeout(() => {
        const btn = document.getElementById('btn-download');
        if (btn) {
          btn.disabled = false;
          btn.addEventListener('click', () => {
            downloadQRCode(qrContainer, title, subtitle, filename);
          });
        }
      }, 300);
    }

    function downloadQRCode(qrContainer, title, subtitle, filename) {
      const canvas = qrContainer.querySelector('canvas');
      const img = qrContainer.querySelector('img');

      const qrSize = 250;
      const padding = 30;
      const titleHeight = subtitle ? 80 : 55;
      const totalWidth = qrSize + padding * 2;
      const totalHeight = qrSize + padding * 2 + titleHeight;

      const combinedCanvas = document.createElement('canvas');
      combinedCanvas.width = totalWidth;
      combinedCanvas.height = totalHeight;
      const ctx = combinedCanvas.getContext('2d');

      ctx.fillStyle = '#ffffff';
      ctx.fillRect(0, 0, totalWidth, totalHeight);

      if (canvas) ctx.drawImage(canvas, padding, padding, qrSize, qrSize);
      else if (img) ctx.drawImage(img, padding, padding, qrSize, qrSize);

      const logo = new Image();
      logo.crossOrigin = 'anonymous';
      logo.onload = () => {
        const logoSize = qrSize * 0.22;
        const logoX = padding + (qrSize - logoSize) / 2;
        const logoY = padding + (qrSize - logoSize) / 2;
        ctx.fillStyle = '#ffffff';
        ctx.fillRect(
          padding + qrSize / 2 - logoSize / 2 - 4,
          padding + qrSize / 2 - logoSize / 2 - 4,
          logoSize + 8,
          logoSize + 8
        );
        ctx.drawImage(logo, logoX, logoY, logoSize, logoSize);
        drawTextAndDownload(ctx, combinedCanvas, totalWidth, totalHeight, title, subtitle, filename);
      };
      logo.onerror = () => {
        drawTextAndDownload(ctx, combinedCanvas, totalWidth, totalHeight, title, subtitle, filename);
      };
      logo.src = '../images/LogoThot.png';
    }

    function drawTextAndDownload(ctx, canvas, width, height, title, subtitle, filename) {
      ctx.fillStyle = '#333333';
      ctx.font = 'bold 22px system-ui, -apple-system, sans-serif';
      ctx.textAlign = 'center';
      const titleY = height - (subtitle ? 50 : 25);
      ctx.fillText(title, width / 2, titleY);

      if (subtitle) {
        ctx.fillStyle = '#666666';
        ctx.font = '16px system-ui, -apple-system, sans-serif';
        ctx.fillText(subtitle, width / 2, height - 22);
      }

      const link = document.createElement('a');
      link.download = `${filename}.png`;
      link.href = canvas.toDataURL('image/png');
      link.click();
    }

    function escapeHtml(str) {
      if (str === null || str === undefined) return '';
      return String(str).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
    }

    init();
  </script>
</body>
</html>
