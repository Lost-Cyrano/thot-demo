<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Thot – Bénévole</title>
  <style>
    :root {
      --red: #e60000;
      --red-hover: #b30000;
      --bg: #f5f5f5;
      --card-bg: #ffffff;
      --border: #ddd;
      --text: #333;
      --text-light: #666;
      --radius: 12px;
      --shadow: 0 2px 8px rgba(0,0,0,0.08);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: system-ui, -apple-system, 'Segoe UI', sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      justify-content: center;
      padding: 16px;
    }

    .container {
      width: 100%;
      max-width: 800px;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    .identity-bar {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 14px 18px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 10px;
      box-shadow: var(--shadow);
    }

    .identity-info {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 12px;
      font-size: 0.95rem;
    }

    .avatar {
      width: 44px;
      height: 44px;
      border-radius: 50%;
      background: var(--red);
      color: #fff;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 700;
      font-size: 1.2rem;
      flex-shrink: 0;
    }

    .identity-text .name { font-weight: 600; }
    .identity-text .details { color: var(--text-light); font-size: 0.85rem; }

    .header-buttons { display: flex; gap: 8px; flex-wrap: wrap; }

    .btn-logout {
      background: transparent;
      color: var(--red);
      border: 1.5px solid var(--red);
      padding: 8px 16px;
      border-radius: 8px;
      cursor: pointer;
      font-weight: 600;
      font-size: 0.9rem;
      transition: all 0.2s;
      white-space: nowrap;
    }
    .btn-logout:hover { background: var(--red); color: #fff; }

    .btn-inventory {
      background: var(--red);
      color: #fff;
      border: none;
      padding: 8px 16px;
      border-radius: 8px;
      cursor: pointer;
      font-weight: 600;
      font-size: 0.9rem;
      transition: all 0.2s;
      white-space: nowrap;
    }
    .btn-inventory:hover { background: var(--red-hover); }

    .section {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      overflow: hidden;
    }

    .section-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 14px 18px;
      background: #fafafa;
      border-bottom: 1px solid var(--border);
      flex-wrap: wrap;
      gap: 10px;
    }

    .section-header h2 { font-size: 1rem; font-weight: 600; }

    .badge {
      background: var(--red);
      color: #fff;
      border-radius: 20px;
      padding: 3px 10px;
      font-size: 0.8rem;
      font-weight: 600;
    }

    .list { list-style: none; }

    .list-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 12px 18px;
      border-bottom: 1px solid #f0f0f0;
      flex-wrap: wrap;
      gap: 10px;
      cursor: pointer;
      transition: background 0.15s;
    }
    .list-item:hover { background: #fafafa; }
    .list-item:last-child { border-bottom: none; }

    .user-info {
      display: flex;
      align-items: center;
      gap: 10px;
      min-width: 0;
      flex: 1;
    }

    .user-avatar {
      width: 36px;
      height: 36px;
      border-radius: 50%;
      background: #eee;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 600;
      font-size: 0.9rem;
      flex-shrink: 0;
      color: #666;
    }

    .user-name { font-weight: 600; font-size: 0.95rem; }
    .user-nivol { color: var(--text-light); font-size: 0.8rem; }

    .show-more {
      padding: 10px 18px;
      text-align: center;
      color: var(--red);
      font-weight: 600;
      font-size: 0.9rem;
      cursor: pointer;
      border-top: 1px solid #f0f0f0;
      transition: background 0.2s;
    }
    .show-more:hover { background: #fafafa; }

    @media (max-width: 480px) {
      .identity-bar { flex-direction: column; align-items: flex-start; }
      .header-buttons { width: 100%; justify-content: flex-end; }
      .list-item { flex-direction: column; align-items: flex-start; }
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="identity-bar">
      <div class="identity-info">
        <div class="avatar" id="avatar-initial"></div>
        <div class="identity-text">
          <div class="name" id="identity-name"></div>
          <div class="details" id="identity-details"></div>
        </div>
      </div>
      <div class="header-buttons">
        <button class="btn-inventory" id="inventory-btn">Faire des vérifications</button>
        <button class="btn-logout" id="logout-btn">Déconnexion</button>
      </div>
    </div>

    <div class="section">
      <div class="section-header">
        <div style="display:flex;align-items:center;gap:8px;flex-wrap:wrap;">
          <h2>Inventaires</h2>
          <span class="badge" id="inventory-count">0</span>
        </div>
      </div>
      <ul class="list" id="inventory-list"></ul>
      <div class="show-more" id="inventory-show-more" style="display:none;">Afficher plus</div>
    </div>

    <div class="section">
      <div class="section-header">
        <div style="display:flex;align-items:center;gap:8px;flex-wrap:wrap;">
          <h2>Parc Automobile</h2>
          <span class="badge" id="vehicle-count">0</span>
        </div>
      </div>
      <ul class="list" id="vehicle-list"></ul>
      <div class="show-more" id="vehicle-show-more" style="display:none;">Afficher plus</div>
    </div>
  </div>

  <script>
    /* ============================================================
       VERSION DÉMO — pas de Firebase, tout en localStorage.
       Clés :
         thot_demo_db    → base JSON complète { U, A, I, P, ... }
         thot_demo_user  → { nivol, role, loggedAt }
       ============================================================ */
    const DB_KEY = 'thot_demo_db';
    const USER_KEY = 'thot_demo_user';
    const ITEMS_PER_PAGE = 2;

    function readDb() {
      const raw = localStorage.getItem(DB_KEY);
      if (!raw) return null;
      try { return JSON.parse(raw); } catch { return null; }
    }

    function readUser() {
      const raw = localStorage.getItem(USER_KEY);
      if (!raw) return null;
      try { return JSON.parse(raw); } catch { return null; }
    }

    // Helpers métier (inchangés dans l'esprit)
    function getLastVerificationDate(data) {
      const logs = data.logs || [];
      if (logs.length === 0) return null;
      return logs[logs.length - 1].t || null;
    }

    function getLastTotalDisinfection(v) {
      const history = v.ddh || [];
      let last = null;
      history.forEach(h => {
        if (h.type === 'total') {
          if (!last || new Date(h.date) > new Date(last.date)) last = h;
        }
      });
      return last;
    }

    let currentUser = null;
    let inventories = [];
    let vehicles = [];
    let inventoryShowAll = false;
    let vehicleShowAll = false;

    const avatarInitial = document.getElementById('avatar-initial');
    const identityName = document.getElementById('identity-name');
    const identityDetails = document.getElementById('identity-details');
    const inventoryCount = document.getElementById('inventory-count');
    const inventoryList = document.getElementById('inventory-list');
    const inventoryShowMore = document.getElementById('inventory-show-more');
    const vehicleCount = document.getElementById('vehicle-count');
    const vehicleList = document.getElementById('vehicle-list');
    const vehicleShowMore = document.getElementById('vehicle-show-more');

    // --- Initialisation ---
    function init() {
      const db = readDb();
      if (!db) {
        // Base pas encore initialisée : on renvoie vers login pour la créer
        window.location.href = './login.html?redirect=' + encodeURIComponent('./user.html');
        return;
      }

      const u = readUser();
      const nivol = (u && u.nivol) ? u.nivol : 'DEMO00000000';

      // Résolution de l'identité : U puis A, sinon fallback
      const uEntry = (db.U && db.U[nivol]) || null;
      const aEntry = (db.A && db.A[nivol]) || null;

      let nom = 'Utilisateur démo';
      let fonction = '';
      if (uEntry) {
        nom = uEntry.I || nom;
        fonction = uEntry.F || '';
      } else if (aEntry) {
        nom = aEntry.I || nom;
        fonction = aEntry.F || '';
      }

      currentUser = { nivol, nom, fonction };

      const initial = (nom.charAt(0) || '?').toUpperCase();
      avatarInitial.textContent = initial;
      identityName.textContent = nom;
      identityDetails.textContent = 'NIVOL : ' + nivol + (fonction ? ' • ' + fonction : '');

      loadInventories(db);
      loadVehicles(db);
    }

    document.getElementById('logout-btn').addEventListener('click', () => {
      localStorage.removeItem(USER_KEY);
      window.location.href = './login.html';
    });

    document.getElementById('inventory-btn').addEventListener('click', () => {
      window.location.href = './inventaire';
    });

    // --- Inventaires ---
    function loadInventories(db) {
      inventories = [];
      const I = db.I || {};
      Object.keys(I).forEach(invId => {
        const data = I[invId] || {};
        inventories.push({
          id: invId,
          nom: data.nom || invId,
          lastVerification: getLastVerificationDate(data)
        });
      });
      inventories.sort((a, b) => a.nom.localeCompare(b.nom, 'fr'));
      renderInventoryList();
    }

    function renderInventoryList() {
      inventoryList.innerHTML = '';
      inventoryCount.textContent = inventories.length;

      const visibleItems = inventoryShowAll ? inventories : inventories.slice(0, ITEMS_PER_PAGE);
      visibleItems.forEach(inv => {
        const li = document.createElement('li');
        li.className = 'list-item';
        const lastVerifText = inv.lastVerification
          ? 'Dernière vérification : ' + new Date(inv.lastVerification).toLocaleDateString('fr-FR')
          : 'Aucune vérification';
        li.innerHTML = `
          <div class="user-info">
            <div class="user-avatar">${(inv.nom.charAt(0)||'?').toUpperCase()}</div>
            <div>
              <div class="user-name">${inv.nom || inv.id || 'Sans nom'}</div>
              <div class="user-nivol">${lastVerifText}</div>
            </div>
          </div>
        `;
        li.addEventListener('click', () => {
          window.location.href = `./inventaire/?inv=${encodeURIComponent(inv.id)}`;
        });
        inventoryList.appendChild(li);
      });

      if (inventories.length > ITEMS_PER_PAGE) {
        inventoryShowMore.style.display = 'block';
        inventoryShowMore.textContent = inventoryShowAll
          ? 'Afficher moins'
          : `Afficher plus (${inventories.length - ITEMS_PER_PAGE} restants)`;
        inventoryShowMore.onclick = () => {
          inventoryShowAll = !inventoryShowAll;
          renderInventoryList();
        };
      } else {
        inventoryShowMore.style.display = 'none';
      }
    }

    // --- Véhicules ---
    function loadVehicles(db) {
      vehicles = [];
      const P = db.P || {};
      Object.keys(P).forEach(vehId => {
        const data = P[vehId] || {};
        vehicles.push({
          id: vehId,
          nom: data.n || data.im || vehId,
          lastTotalDisinfection: getLastTotalDisinfection(data)
        });
      });
      vehicles.sort((a, b) => (a.nom || a.id).localeCompare(b.nom || b.id, 'fr'));
      renderVehicleList();
    }

    function renderVehicleList() {
      vehicleList.innerHTML = '';
      vehicleCount.textContent = vehicles.length;

      const visibleItems = vehicleShowAll ? vehicles : vehicles.slice(0, ITEMS_PER_PAGE);
      visibleItems.forEach(veh => {
        const li = document.createElement('li');
        li.className = 'list-item';
        const lastTotal = veh.lastTotalDisinfection;
        const lastTotalText = lastTotal
          ? 'Dernière désinfection totale : ' + new Date(lastTotal.date).toLocaleDateString('fr-FR') + ' par ' + (lastTotal.par || '?')
          : 'Aucune désinfection totale';
        li.innerHTML = `
          <div class="user-info">
            <div class="user-avatar">🚗</div>
            <div>
              <div class="user-name">${veh.nom || veh.id || 'Sans nom'}</div>
              <div class="user-nivol">${lastTotalText}</div>
            </div>
          </div>
        `;
        li.addEventListener('click', () => {
          window.location.href = `./parc-auto/?vehicule=${encodeURIComponent(veh.id)}`;
        });
        vehicleList.appendChild(li);
      });

      if (vehicles.length > ITEMS_PER_PAGE) {
        vehicleShowMore.style.display = 'block';
        vehicleShowMore.textContent = vehicleShowAll
          ? 'Afficher moins'
          : `Afficher plus (${vehicles.length - ITEMS_PER_PAGE} restants)`;
        vehicleShowMore.onclick = () => {
          vehicleShowAll = !vehicleShowAll;
          renderVehicleList();
        };
      } else {
        vehicleShowMore.style.display = 'none';
      }
    }

    init();
  </script>
</body>
</html>
