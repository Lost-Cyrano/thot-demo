<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Thot – Inventaires (démo)</title>
  <style>
    body {
      font-family: system-ui, -apple-system, 'Segoe UI', sans-serif;
      background: #f5f5f5;
      color: #555;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 0;
      padding: 20px;
    }
    .loader {
      text-align: center;
      font-size: 0.9rem;
    }
    .loader .spinner {
      width: 28px;
      height: 28px;
      border: 3px solid #eee;
      border-top-color: #e60000;
      border-radius: 50%;
      margin: 0 auto 12px;
      animation: spin 0.8s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    a { color: #e60000; }
  </style>
</head>
<body>
  <div class="loader">
    <div class="spinner" aria-hidden="true"></div>
    <div>Redirection vers la page de connexion…</div>
    <noscript>
      <p>JavaScript est désactivé. <a href="./login.html">Cliquez ici pour continuer.</a></p>
    </noscript>
  </div>

  <script>
    // Conserve un éventuel paramètre ?redirect=
    const urlParams = new URLSearchParams(window.location.search);
    const redirect = urlParams.get('redirect');

    let target = './login.html';
    if (redirect) {
      target += '?redirect=' + encodeURIComponent(redirect);
    }
    window.location.replace(target);
  </script>
</body>
</html>
